name: Generate and publish profile art

# Lives in the PRIVATE repo (e.g. whokrishverma/profile-art-generator).
# Builds whichever of ascii.svg / contrib-heatmap.svg / info-card.svg are
# due for an update, then pushes ONLY the changed files to the PUBLIC
# whokrishverma/whokrishverma repo, where GitHub renders the profile README.
#
# Trigger behavior:
#   - ascii portrait: avatar checked at midnight only; script runs only if
#     the avatar actually differs from photo.jpg. Also runs on push (if
#     photo.jpg changed in that push) and always on manual run.
#   - heatmap: regenerated every 6 hours, at midnight, on every push, and
#     on manual run. (The SVG is only pushed to the public repo if it
#     actually differs from what's already published, via the diff-staged
#     check in the final step -- so "no visible change" still costs a
#     cheap script run, but never an unnecessary commit.)
#   - info card: runs at midnight, on every push, and on manual run.

"on":
  schedule:
    - cron: "0 */6 * * *"
    - cron: "30 18 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pillow numpy opencv-python-headless

      # 1. Detect photo changes
      - name: Check if photo changed in this push
        id: photo_diff
        if: github.event_name == 'push'
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "$AFTER" | grep -q '^assets/photos/photo\.jpg$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # 2. Download GitHub avatar
      - name: Download current GitHub avatar
        id: avatar_download
        if: >
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'schedule' && github.event.schedule == '30 18 * * *')
        run: curl -fsSL "https://github.com/whokrishverma.png?size=460" -o avatar_new.jpg

      - name: Check if avatar differs from photo
        id: avatar_diff
        if: steps.avatar_download.outcome == 'success'
        run: |
          if [ -f assets/photos/photo.jpg ] && cmp -s assets/photos/photo.jpg avatar_new.jpg; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Adopt new avatar as photo
        if: steps.avatar_diff.outputs.changed == 'true'
        run: mv avatar_new.jpg assets/photos/photo.jpg

      # 3. Generate ASCII portrait
      - name: Regenerate ASCII portrait
        id: ascii_gen
        if: >
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && steps.photo_diff.outputs.changed == 'true') ||
          (github.event_name == 'schedule' && steps.avatar_diff.outputs.changed == 'true')
        run: |
          mkdir -p generated

          TYPE=$(cat assets/photos/photo.type | tr -d '[:space:]')

          if [ "$TYPE" = "illustration" ]; then
            python generators/ascii/make_ascii_svg_illustration_v5.py \
              assets/photos/photo.jpg ascii.svg
          else
            python generators/ascii/make_ascii_svg_real_v1.py \
              assets/photos/photo.jpg ascii.svg
          fi

          echo "done=true" >> "$GITHUB_OUTPUT"

      # 4. Generate contribution heatmap
      - name: Regenerate contribution heatmap
        id: heatmap_gen
        if: >
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'schedule'
        env:
          PROFILE_REPO_PAT: ${{ secrets.PROFILE_REPO_PAT }}
        run: |
          mkdir -p generated

          python generators/heatmap/generate_streak_svg_v1.py \
            whokrishverma generated/contrib-heatmap.svg

          echo "done=true" >> "$GITHUB_OUTPUT"

      # 5. Generate info card
      - name: Regenerate info card
        id: infocard_gen
        if: >
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'schedule' && github.event.schedule == '30 18 * * *')
        run: |
          python generators/info-card/make_info_card_v1.py
          echo "done=true" >> "$GITHUB_OUTPUT"

      # 6. Publish generated artwork
      - name: Push generated SVGs to public profile repo
        if: >
          steps.ascii_gen.outputs.done == 'true' ||
          steps.heatmap_gen.outputs.done == 'true' ||
          steps.infocard_gen.outputs.done == 'true'
        env:
          GH_TOKEN: ${{ secrets.PROFILE_REPO_PAT }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/whokrishverma/whokrishverma.git public-repo

          if [ "${{ steps.ascii_gen.outputs.done }}" = "true" ]; then
            cp ascii.svg public-repo/
          fi

          if [ "${{ steps.heatmap_gen.outputs.done }}" = "true" ]; then
            cp generated/contrib-heatmap.svg public-repo/
          fi

          if [ "${{ steps.infocard_gen.outputs.done }}" = "true" ]; then
            cp info-card.svg public-repo/
          fi

          cd public-repo

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add ascii.svg contrib-heatmap.svg info-card.svg

          git diff --staged --quiet || git commit -m "chore: refresh profile art [skip ci]"

          git push